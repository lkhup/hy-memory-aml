name: hy-memory-aml

services:
  aml-api:
    build:
      context: .
    image: hy-memory-aml:0.1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DOCS_ENABLED: "false"
      DATA_DIR: /data/adapter
      MEMORY_DATA_DIR: /data/hy-memory
      MEMORY_VECTOR_STORE: qdrant
      MEMORY_VECTOR_HOST: qdrant
      MEMORY_VECTOR_PORT: "6333"
      MEMORY_VECTOR_API_KEY: ${QDRANT_API_KEY}
    volumes:
      - aml_data:/data
    expose:
      - "8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - internal

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
      - "6334"
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ':> /dev/tcp/127.0.0.1/6333'"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      aml-api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  aml_data:
  qdrant_data:
  caddy_data:
  caddy_config:

