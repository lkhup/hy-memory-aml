[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hy-memory-aml"
version = "0.2.0"
description = "AML Cycle 2 Add/Search adapter for Tencent Hy-Memory 2.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.116.1",
  "hy-memory[qdrant]==2.0.3",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "ruff==0.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "multitrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", ".uv-cache", ".uv-python", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

